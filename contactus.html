<!DOCTYPE html>
<html lang="en">

<head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Contact Us</title>


         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

         <link rel="stylesheet" href="style.css">
         <style>
                  /* style.css */

                  * {
                           margin: 0;
                           padding: 0;
                           box-sizing: border-box;
                           font-family: Arial, sans-serif;
                  }

                  body {
                           background: #f5f5f5;
                  }



                  .contact-top {
                           background: linear-gradient(to right, #2d2d2d, #3b3b3b);
                           padding: 50px 20px;
                           text-align: center;
                           color: white;
                           border-top: 5px solid #8bc000;
                  }

                  .contact-top h1 {
                           font-size: 50px;
                           margin-bottom: 40px;
                  }

                  .contact-info {
                           display: flex;
                           justify-content: center;
                           gap: 20px;
                           flex-wrap: wrap;
                  }

                  .info-box {
                           border: 1px solid #666;
                           padding: 20px 25px;
                           display: flex;
                           align-items: center;
                           gap: 15px;
                           border-radius: 5px;
                           min-width: 250px;
                  }

                  .info-box i {
                           font-size: 35px;
                           color: #8bc000;
                  }

                  .info-box h3 {
                           margin-bottom: 5px;
                  }

                  .info-box p {
                           color: #ddd;
                           font-size: 14px;
                  }

                  /* Form Section */

                  .contact-form-section {
                           padding: 60px 20px;
                           text-align: center;
                  }

                  .contact-form-section h2 {
                           font-size: 40px;
                           color: #333;
                  }

                  .contact-form-section h3 {
                           font-size: 35px;
                           color: #8bc000;
                           margin-bottom: 40px;
                  }

                  .form-container {
                           max-width: 800px;
                           margin: auto;
                           background: white;
                           padding: 40px;
                           border-radius: 10px;
                           box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
                  }

                  form {
                           width: 100%;
                  }

                  .input-group {
                           display: flex;
                           gap: 20px;
                           margin-bottom: 20px;
                  }

                  .input-box {
                           flex: 1;
                           text-align: left;
                           margin-bottom: 20px;
                  }

                  .input-box label {
                           display: block;
                           margin-bottom: 8px;
                           font-size: 14px;
                           color: #333;
                  }

                  .input-box input,
                  .input-box textarea {
                           width: 100%;
                           padding: 12px;
                           border: 1px solid #ddd;
                           border-radius: 5px;
                           outline: none;
                  }

                  .input-box textarea {
                           height: 150px;
                           resize: none;
                  }

                  button {
                           background: #005d1f;
                           color: white;
                           padding: 12px 25px;
                           border: none;
                           border-radius: 5px;
                           cursor: pointer;
                           font-size: 16px;
                           transition: 0.3s;
                  }

                  button:hover {
                           background: #00852d;
                  }

                  /* Responsive */

                  @media(max-width: 768px) {

                           .contact-top h1 {
                                    font-size: 38px;
                           }

                           .contact-form-section h2 {
                                    font-size: 30px;
                           }

                           .contact-form-section h3 {
                                    font-size: 28px;
                           }

                           .input-group {
                                    flex-direction: column;
                           }
                  }

                  .navbar {
                           display: flex;
                           justify-content: space-between;
                           align-items: center;
                           background: #7ea300;
                           padding: 15px 60px;
                           color: white;
                  }

                  .logo {
                           display: flex;
                           align-items: center;
                           gap: 10px;
                  }

                  .logo img {
                           width: 40px;
                  }

                  .nav-links {
                           display: flex;
                           list-style: none;
                           gap: 25px;
                  }

                  .nav-links a {
                           color: white;
                           text-decoration: none;
                           font-size: 14px;
                  }
         </style>
</head>

<body>
         <nav class="navbar">
                  <div class="logo">
                           <img src="images/logo.jpg" alt="Logo">
                           <h2>Kira Clinic</h2>
                  </div>

                  <ul class="nav-links">
                           <li><a href="">Contact US</a></li>
                           <li><a href="#">Services</a></li>
                           <li><a href="#">Partnership</a></li>
                           <li><a href="#">Our Doctors</a></li>
                           <li><a href="#">About</a></li>
                           <li><a href="home.html">Home</a></li>
                  </ul>
         </nav>



         <section class="contact-top">
                  <h1>Contact us</h1>

                  <div class="contact-info">

                           <div class="info-box">
                                    <i class="fa-solid fa-phone"></i>
                                    <div>
                                             <h3>Phone</h3>
                                             <p>+250 788 888 888</p>
                                    </div>
                           </div>

                           <div class="info-box">
                                    <i class="fa-solid fa-envelope"></i>
                                    <div>
                                             <h3>Email</h3>
                                             <p>info@kiraclinic.com</p>
                                    </div>
                           </div>

                           <div class="info-box">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <div>
                                             <h3>Location</h3>
                                             <p>Nyagatare District</p>
                                    </div>
                           </div>

                  </div>
         </section>


         <section class="contact-form-section">

                  <h2>Love to hear from you,</h2>
                  <h3>Let's get in touch!</h3>

                  <div class="form-container">

                           <form>

                                    <div class="input-group">
                                             <div class="input-box">
                                                      <label>Your names</label>
                                                      <input type="text" placeholder="Type your full names">
                                             </div>

                                             <div class="input-box">
                                                      <label>Your email</label>
                                                      <input type="email" placeholder="Type your email">
                                             </div>
                                    </div>

                                    <div class="input-box full-width">
                                             <label>Subject</label>
                                             <input type="text" placeholder="Type subject">
                                    </div>

                                    <div class="input-box full-width">
                                             <label>Your message</label>
                                             <textarea placeholder="Write your message"></textarea>
                                    </div>

                                    <button type="submit">Send message</button>

                           </form>

                  </div>

         </section>

</body>

</html>
