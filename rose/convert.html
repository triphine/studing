<!DOCTYPE html>
<html lang="en">

<head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Currency Exchange</title>
         <link rel="stylesheet" href="style.css">
</head>

<body>

         <section class="hero">
                  <div class="header">
                           <h1>XYZ-COMPANY</h1>
                           <p>CURRENCY EXCHANGE PLATFORM</p>
                  </div>

                  <div class="card">
                           <div class="form-row">

                                    <div class="input-group">
                                             <label>Amount</label>
                                             <input type="text" value="100">
                                    </div>

                                    <div class="input-group">
                                             <label>From</label>
                                             <select>
                                                      <option>USD - $</option>
                                             </select>
                                    </div>

                                    <div class="input-group">
                                             <label>To</label>
                                             <select>
                                                      <option>Rwanda - RWF</option>
                                             </select>
                                    </div>

                           </div>

                           <div class="bottom-row">
                                    <button class="convert-btn">Convert</button>

                                    <div class="result">
                                             <p>Result</p>
                                             <h2>10 300</h2>
                                    </div>
                           </div>
                  </div>
         </section>

</body>

</html>
